<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>末法仙途</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <style>
    /* Ink #0d1f27 = palette index 1 (see src/assets/palette.json) */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0d1f27;
      overflow: hidden;
    }
    /* Pixel Chinese first, hanzi fallbacks behind it (doc/14 §8.1).
       Font sizes only from the 12/16/24 ladder. */
    @font-face {
      font-family: 'Fusion Pixel';
      src: url('/fonts/fusion-pixel-12px-monospaced-zh_hans.woff2') format('woff2');
      font-display: swap;
    }
    :root {
      --font-ui: 'Fusion Pixel', 'Zpix', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    }
    body {
      font-family: var(--font-ui);
      font-size: 12px;
      -webkit-font-smoothing: none;
    }
    /* Phaser canvas host and Vue overlay host are siblings so that
       Vue mounting never wipes the game container (doc/13 §2). */
    #game-root, #ui-root {
      position: fixed;
      inset: 0;
    }
    #game-root {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Pixel-perfect upscaling, see doc/14 §8.6 */
    canvas {
      image-rendering: pixelated;
      image-rendering: -webkit-optimize-contrast;
    }
      /* Portrait warning (doc/14 §8.6): landscape plays better. */
    #rotate-hint {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99;
      background: rgba(13, 31, 39, 0.96);
      color: #e0c070;
      font-family: 'Fusion Pixel', 'Noto Sans SC', sans-serif;
      font-size: 16px;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      letter-spacing: 2px;
    }
    @media (orientation: portrait) and (max-width: 820px) {
      #rotate-hint { display: flex; }
    }
    /* Small screens: panels become full-screen drawers */
    @media (max-width: 700px) {
      .panel { width: 100vw !important; max-width: 100vw !important; min-height: 100vh; border: none; }
      .panel-wrap { align-items: stretch; padding: 0; }
      .dialog { width: 100vw; max-width: 100vw; }
    }
  </style>
</head>
<body>
  <div id="game-root"></div>
  <div id="rotate-hint">横屏游玩体验更好</div>
  <script>
    // Integer-multiple scaling with letterbox (doc/14 §8.6): never 1.5x.
    window.__fitCanvas = function () {
      const canvas = document.querySelector('#game-root canvas')
      if (!canvas) return
      const z = Math.max(1, Math.floor(Math.min(window.innerWidth / 640, window.innerHeight / 360)))
      canvas.style.width = 640 * z + 'px'
      canvas.style.height = 360 * z + 'px'
    }
    window.addEventListener('resize', window.__fitCanvas)
  </script>
  <div id="ui-root"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
